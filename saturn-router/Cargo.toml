[package]
name = "saturn"
version = "0.1.0"
edition = "2021"
authors = ["Joey Perrello"]
description = "Saturn beacon service for mDNS/DNS-SD AI service discovery"

[features]
default = ["native-tls"]
native-tls = ["attohttpc/tls-native"]
rustls = ["attohttpc/tls-rustls"]
# No TLS - for network-only mode (local Ollama/vLLM health checks, no OpenRouter)
# This produces the smallest binary (~500KB vs ~2MB)
network-only = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hostname = "0.4"
attohttpc = { version = "0.28", default-features = false, features = ["json"] }
mdns-sd = "0.11"
local-ip-address = "0.6"
ctrlc = "3.4"
log = "0.4"
env_logger = "0.11"
time = { version = "0.3", features = ["formatting"] }

[profile.release]
opt-level = "z"          # Optimize for size
lto = true               # Link-time optimization
codegen-units = 1        # Single codegen unit for better optimization
panic = "abort"          # Abort on panic (stable, nearly as small as immediate-abort)
strip = true             # Strip symbols
overflow-checks = true   # Enable overflow checks for safety
debug = false            # No debug info
incremental = false      # Disable incremental compilation for release
