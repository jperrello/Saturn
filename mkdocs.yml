site_name: Saturn
site_description: Zero-configuration AI service discovery using mDNS/DNS-SD
site_url: https://jperrello.github.io/Saturn/
repo_url: https://github.com/jperrello/Saturn
repo_name: jperrello/Saturn

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  font:
    code: JetBrains Mono
  logo: assets/saturn-logo.svg
  favicon: assets/saturn-logo.svg
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: ""
  - attr_list
  - def_list
  - md_in_html

nav:
  - Home: index.md
  - Python package — easy install: python-package.md
  - Getting Started:
    - Quick Start: getting-started/quickstart.md
    - Troubleshooting: getting-started/troubleshooting.md
    - FAQ: getting-started/faq.md
  - Web UI:
    - Overview: web-ui/overview.md
    - Chat: web-ui/chat.md
    - Models & Parameters: web-ui/models.md
    - MCP Tools: web-ui/mcp-tools.md
    - System & Monitoring: web-ui/system.md
    - Remote Access: web-ui/remote.md
    - Cost Tracking: web-ui/cost-tracking.md
  - Configuration:
    - Service Configuration: configuration/service-config.md
    - Config TOML Reference: configuration/config-toml.md
    - Environment Variables: configuration/env-vars.md
    - Priority & Failover: configuration/priority-routing.md
    - Rate Limiting & Budgets: configuration/rate-limiting.md
    - Cloudflare Tunnels: configuration/tunnels.md
    - CLI Reference: configuration/cli.md
  - Reference:
    - Protocol Specification: reference/protocol.md
    - Discovery Flow: reference/discovery.md
    - Beacons & Ephemeral Keys: reference/beacons.md
    - Security Model: reference/security.md
    - Python SDK: reference/python-package.md
    - AI SDK Provider (JS/TS): reference/ai-sdk-provider.md
    - Saturn Router (Rust): reference/router.md
    - REST API: reference/api.md
    - MCP Tools: reference/mcp-tools.md
  - Integrations:
    - Overview: integrations/index.md
    - OpenCode: integrations/opencode.md
    - Aider: integrations/aider.md
    - MCP Server: integrations/mcp-server.md
    - VLC Extension: integrations/vlc.md
    - Open WebUI: integrations/open-webui.md
    - Jan AI: integrations/jan.md
