name = "deepinfra"
deployment = "network"
api_type = "openai"
priority = 10

[upstream]
base_url = "https://api.deepinfra.com/v1/openai"
api_key_env = "DEEPINFRA_API_KEY"

[server]
port = 8090

[beacon]
enabled = true
key_endpoint = "https://api.deepinfra.com/v1/api_token"
rotation_interval = 300
spending_limit = 0
expiration_interval = 600
