[project]
name = "saturn-mcp"
version = "0.1.0"
description = "MCP server for Saturn AI service discovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "saturn",
]

[tool.uv.sources]
saturn = { path = ".." }

[project.scripts]
saturn-mcp = "saturn_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saturn_mcp"]
