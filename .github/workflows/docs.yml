name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/_archive/index-legacy.html'
      - 'docs/_archive/saturn.png'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble single-page site
        run: |
          mkdir -p site
          cp docs/_archive/index-legacy.html site/index.html
          cp docs/_archive/saturn.png site/saturn.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
