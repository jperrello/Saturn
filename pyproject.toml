[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saturn"
version = "2.0.0"
description = "Zero-configuration AI service discovery using mDNS/DNS-SD"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Joey Perrello", email = "jperrello8@gmail.com"}
]
keywords = ["ai", "mcp", "dns-sd", "mdns", "service-discovery", "llm"]
dependencies = [
    "zeroconf>=0.80.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
saturn = "saturn.__main__:main"
saturn-deepinfra-beacon = "saturn.deepinfra_beacon:main"
saturn-dibeacon = "saturn.deepinfra_beacon:main"
saturn-openrouter-beacon = "saturn.openrouter_beacon:main"
saturn-orbeacon = "saturn.openrouter_beacon:main"
saturn-beacon-proxy = "saturn.beacon_proxy:main"
saturn-openrouter = "saturn.openrouter_server:main"
saturn-ollama = "saturn.ollama_server:main"
aider-saturn = "saturn.aider_saturn:main"

[project.urls]
Homepage = "https://github.com/jperrello/Saturn"
Repository = "https://github.com/jperrello/Saturn"

[tool.setuptools.packages.find]
include = ["saturn*"]
